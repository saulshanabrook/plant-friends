name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_BASE_PATH: /plant-friends/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: node --test scripts/pages-assets.test.mjs
      - run: node --test scripts/photos-assets.test.mjs
      - name: Restore pinned prepared catalog, model and runtime
        run: node scripts/pages-assets.mjs restore
      - name: Restore pinned reference photos
        run: node scripts/photos-assets.mjs restore
      - run: npm test
      - run: npm run build
      - name: Verify exact prepared asset bytes after the build
        run: node scripts/pages-assets.mjs verify --target dist
      - name: Verify reference photos and published size
        run: |
          node scripts/photos-assets.mjs verify --target dist
          node scripts/photos-assets.mjs check-size --target dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
